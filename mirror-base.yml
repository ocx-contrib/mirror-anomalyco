# Shared base for every spec in this repository (Anomaly Innovations).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, announce, annotations — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT — there is no per-key merge. `platforms:`
# is where this bites: it carries BOTH the runner matrix and the container
# legs, so a child that restates it to tweak one runner silently drops every
# `containers:` entry. Nothing reds — the legs simply stop existing, and every
# os.features claim in that spec goes back to being merely asserted. Restate
# `platforms:` IN FULL or not at all.

skip_prereleases: true
cascade: true

# GC-safe: each build keeps its own retained X.Y.Z+<date> tag, so a stray
# rebuild (ocx-sh/ocx#157) can't orphan a pinned digest. The bare cascade tag
# still floats. opencode versions as bare semver, so there is no existing
# +build segment for `date` to collide with.
build_timestamp: date

verify:
  github_asset_digest: true

concurrency:
  # A bun-compiled single-file binary is ~180 MB unpacked (the JS runtime is
  # embedded), an order of magnitude past a Go/Rust CLI — so bundle and push
  # concurrency stay low while downloads stay wide.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

# `off`, and it cannot be otherwise here. The scan only looks BELOW an
# interface PATH entry of the form ${installPath}/<dir>, and every archive in
# this repo is a flat single binary at the root (strip_components 0) — the
# executable IS the content root, so PATH is a bare ${installPath}. `auto` or
# `verify` is rejected at spec load with exit 65 ("bin_scan is enabled but …
# declares no interface-visible ${installPath}/<dir> PATH entry"). `off` with a
# hand-listed `binaries` in metadata.json is the blessed shape. A future
# package here shipping an archive with a bin/ dir should override to `verify`.
bin_scan: off

# ─── Platform matrix ────────────────────────────────────────────────────────
#
# `os.features` states what an artifact REQUIRES OF THE HOST — it is not a
# label for how it was built. opencode is a bun-compiled single-file binary and
# upstream ships a glibc AND a musl Linux build per arch. Measured 2026-08-01
# on v1.18.11 (evidence above opencode/mirror.yml's `assets:`): NEITHER is
# static — each names its own loader in PT_INTERP — so neither covers the other
# and BOTH Linux flavours carry an explicit libc feature:
#
#   - opencode-linux-{x64,arm64}.tar.gz       → /lib*/ld-linux-*  → +libc.glibc
#   - opencode-linux-{x64,arm64}-musl.tar.gz  → /lib/ld-musl-*    → +libc.musl
#
# Container legs follow from what each key CLAIMS, and are the only mechanism
# that turns a claim into evidence: `+libc.glibc` → ubuntu + fedora, NO alpine;
# `+libc.musl` → alpine, NOTHING ELSE. Neither build can load under the other's
# libc, so a crossed leg would red on a correct artifact.
#
# ─── The musl legs need `libstdc++` — measured, not assumed ─────────────────
#
# bun's musl build links the C++ runtime as well as musl: DT_NEEDED lists
# libstdc++.so.6 and libgcc_s.so.1, and bare Alpine ships neither. Re-measured
# 2026-08-02 on v1.18.11, BOTH arches (arm64 via qemu-aarch64 binfmt):
#
#   $ docker run alpine:3.20 /pkg/opencode --version
#   Error loading shared library libstdc++.so.6: No such file or directory
#   Error loading shared library libgcc_s.so.1: No such file or directory
#   Error relocating /pkg/opencode: __cxa_guard_acquire: symbol not found  (…)
#
#   $ docker run alpine:3.20 sh -c 'apk add --no-cache libstdc++ && /pkg/opencode --version'
#   1.18.11                                                          exit 0
#
# ONE package covers both NEEDED entries — Alpine's `libstdc++` depends on
# `libgcc`, so `apk add libstdc++` installs libgcc first (2 packages, 10 MiB).
# That is the whole provisioning cost, and it is why `setup:` is one line.
#
# This was withheld until 2026-08-02: a container entry took only
# `image`/`id`/`shell`, so there was nowhere to install into, and the honest
# outcome was to publish glibc only rather than assert an unproven claim.
# ocx-mirror 0.5.1 added `containers[].setup` — commands baked into the leg's
# image with `docker build` before any test — which makes the claim provable
# and narrows it honestly: not "runs on stock Alpine", but "runs on Alpine plus
# libstdc++". Do NOT swap the base for a fat musl image that happens to carry
# the C++ runtime (e.g. `node:22-alpine3.20`): it is rejected at spec load
# anyway (only `alpine:<tag>` classifies as musl), and it would hide from the
# leg exactly what a user must install on their own machine.
platforms:
  "linux/amd64+libc.glibc":
    runner: ubuntu-latest
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/arm64+libc.glibc":
    # arm64 container legs run natively — no qemu — so the runner arch must
    # match the platform or the renderer's guard reds the leg up front.
    runner: ubuntu-24.04-arm
    containers:
      - { image: "ubuntu:24.04", shell: bash }
      - { image: "fedora:40",    shell: bash }
  "linux/amd64+libc.musl":
    runner: ubuntu-latest
    containers:
      - image: "alpine:3.20"
        shell: sh
        setup: &musl_setup
          - apk add --no-cache libstdc++
  "linux/arm64+libc.musl":
    # Native arm64 runner, same reason as the glibc arm64 key above.
    runner: ubuntu-24.04-arm
    containers:
      - image: "alpine:3.20"
        shell: sh
        setup: *musl_setup
  # darwin/amd64 is deliberately absent, from `assets:` as well as here.
  # opencode is bun-compiled, and bun SIGILLs (exit 132) under Rosetta 2 —
  # proven across the non-baseline build, the -baseline build, AND
  # BUN_JSC_useJIT=0, so it is a native-startup illegal instruction, not a
  # JIT/AVX2 path selectable by asset or env. GitHub retired native Intel macOS
  # runners, so the slice cannot be CI-validated at all. (A native Go/C binary
  # like yq DOES pass darwin/amd64 via Rosetta — this is bun-only.) The Intel
  # build runs fine on real Intel Macs; it just cannot be tested here.
  darwin/arm64:
    runner: macos-14
    shell: bash
  windows/amd64:
    runner: windows-latest
    shell: pwsh
  windows/arm64:
    # Native arm64 Windows runner — the amd64 pool cannot execute an ARM64 PE.
    runner: windows-11-arm
    shell: pwsh
  # No `containers:` on darwin or windows — those runners have no Linux
  # container engine, and the key is rejected at spec load.

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
